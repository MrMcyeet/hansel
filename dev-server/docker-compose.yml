# Hansel development server: PC-hosted routing + geocoding on the owner's LAN.
#
# ONLINE, PC-HOSTED routing for development only (DESIGN.md §4.3, §15 Phase 1).
# Not offline phone support.
#
# Image names/tags and env vars were checked against the upstream docs on 2026-11-05;
# see README.md "Verified against". This file has been syntax-checked but not executed
# (no Docker available where it was written).
#
# Usage:  cp .env.example .env && scripts/fetch-extract.sh && scripts/build-graphs.sh

name: hansel-dev

services:
  # ---------------------------------------------------------------------------
  # Valhalla (https://github.com/valhalla/valhalla/blob/master/docker/README.md)
  # The old gis-ops/docker-valhalla image was archived 2026-03 and moved upstream;
  # the scripted image keeps the same env-var contract.
  # ---------------------------------------------------------------------------
  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:latest
    container_name: hansel-valhalla
    ports:
      - "${VALHALLA_PORT:-8002}:8002"
    volumes:
      # Tiles, valhalla.json, admins/timezones DBs, file_hashes.txt all live here.
      - ./data/valhalla:/custom_files
      # The scripted entrypoint only picks up /custom_files/*.pbf (top level), so the
      # merged extract is bind-mounted directly into that directory, read-only.
      - ./data/osm/${HANSEL_PBF:-gulf-south.osm.pbf}:/custom_files/${HANSEL_PBF:-gulf-south.osm.pbf}:ro
    environment:
      # First start: no tiles exist -> builds them from the PBF above.
      # Later starts: tiles exist and use_tiles_ignore_pbf=True -> skips the build even if
      # the PBF changes. Set force_rebuild=True (once) after refreshing the extract.
      - use_tiles_ignore_pbf=True
      - force_rebuild=False
      - build_tar=True
      - build_admins=True        # border/turn restriction context + admin fields in responses
      - build_time_zones=True    # needed for date_time (time-dependent) routing
      - build_elevation=False    # not needed for car routing; saves a large download
      - build_transit=False
      - serve_tiles=True
      - server_threads=${VALHALLA_THREADS:-4}
      - update_existing_config=True   # merges missing keys into valhalla.json; keeps our overrides
      - use_default_speeds_config=True
      - tileset_name=valhalla_tiles
      - traffic_name=
    # service_limits (max_alternates=3, max_locations=50, ...) are seeded into
    # data/valhalla/valhalla.json by scripts/build-graphs.sh from valhalla/valhalla.seed.json;
    # update_existing_config=True fills in every other key with upstream defaults.
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8002/status >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 120s

  # ---------------------------------------------------------------------------
  # GraphHopper (https://hub.docker.com/r/israelhikingmap/graphhopper)
  # Tag 11.0 matches the app's graphhopper-core 11.x dependency; `latest` is a nightly
  # build of upstream master and may change API behaviour.
  # ---------------------------------------------------------------------------
  graphhopper:
    image: israelhikingmap/graphhopper:11.0
    container_name: hansel-graphhopper
    ports:
      - "${GRAPHHOPPER_PORT:-8989}:8989"
    volumes:
      - ./data/graphhopper:/data
      - ./data/osm:/data/osm:ro
      - ./graphhopper/config.yml:/data/config.yml:ro
    environment:
      - JAVA_OPTS=${GRAPHHOPPER_JAVA_OPTS:--Xmx4g -Xms1g}
    # The image's ENTRYPOINT is `./graphhopper.sh -c config-example.yml`; we override it so our
    # config is authoritative. graphhopper.sh translates -i/-c/-o/--host into -Ddw.* properties.
    entrypoint: ["./graphhopper.sh"]
    command:
      - "-i"
      - "/data/osm/${HANSEL_PBF:-gulf-south.osm.pbf}"
      - "-c"
      - "/data/config.yml"
      - "-o"
      - "/data/graph-cache"
      - "--host"
      - "0.0.0.0"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8989/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 120s

  # ---------------------------------------------------------------------------
  # Nominatim (https://github.com/mediagis/nominatim-docker, howto.md for 5.3)
  # Single container with Postgres 16 + Nominatim 5.3. First start imports the PBF
  # (long!); subsequent starts reuse the Postgres volume.
  # ---------------------------------------------------------------------------
  nominatim:
    image: mediagis/nominatim:5.3
    container_name: hansel-nominatim
    ports:
      - "${NOMINATIM_PORT:-8080}:8080"
    volumes:
      - ./data/osm:/nominatim/data:ro
      - nominatim-pg:/var/lib/postgresql/16/main
      - nominatim-flatnode:/nominatim/flatnode
    environment:
      - PBF_PATH=/nominatim/data/${HANSEL_PBF:-gulf-south.osm.pbf}
      # No REPLICATION_URL -> no update downloads; the merged extract has no single update feed anyway.
      - UPDATE_MODE=none
      - IMPORT_WIKIPEDIA=false
      - IMPORT_SECONDARY_WIKIPEDIA=false
      - IMPORT_US_POSTCODES=false     # set true for better ZIP-code results (small extra download)
      - IMPORT_GB_POSTCODES=false
      - IMPORT_TIGER_ADDRESSES=false  # true = better US house numbers but downloads the whole-US TIGER set
      - IMPORT_STYLE=full             # includes POIs (needed for "Hattiesburg Walmart"-style search)
      - FREEZE=true                   # no updates planned; saves disk
      - THREADS=${NOMINATIM_THREADS:-4}
      - NOMINATIM_PASSWORD=${NOMINATIM_PASSWORD:-hansel-dev-only}
      - POSTGRES_SHARED_BUFFERS=${NOMINATIM_POSTGRES_SHARED_BUFFERS:-2GB}
      - POSTGRES_MAINTENANCE_WORK_MEM=${NOMINATIM_POSTGRES_MAINTENANCE_WORK_MEM:-4GB}
      - POSTGRES_EFFECTIVE_CACHE_SIZE=${NOMINATIM_POSTGRES_EFFECTIVE_CACHE_SIZE:-8GB}
      - POSTGRES_AUTOVACUUM_WORK_MEM=1GB
    # Postgres needs a larger /dev/shm than Docker's 64 MB default for imports.
    shm_size: "1g"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/status >/dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 30
      start_period: 600s

  # ---------------------------------------------------------------------------
  # Photon (optional, NOT verified): Elasticsearch/OpenSearch-based autocomplete geocoder
  # that imports from the Nominatim database. Useful later for as-you-type search in the
  # app; Nominatim's /search is fine for a first cut. Image choice and env vars were not
  # checked against docs on 2026-11-05, so this stays commented out.
  # ---------------------------------------------------------------------------
  # photon:
  #   image: rtuszik/photon-docker:latest
  #   container_name: hansel-photon
  #   ports:
  #     - "2322:2322"
  #   volumes:
  #     - ./data/photon:/photon/photon_data
  #   depends_on:
  #     nominatim:
  #       condition: service_healthy

volumes:
  nominatim-pg:
  nominatim-flatnode:
