org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Phase 0 spike toggle: include the on-device GraphHopper module (see spikes/graphhopper-ondevice/README.md)
hansel.spike.graphhopperOnDevice=false

# Resilience for flaky mirrors/proxies
systemProp.org.gradle.internal.repository.max.retries=10
systemProp.org.gradle.internal.repository.initial.backoff=3000
org.gradle.workers.max=2
